<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2020RM — Sign In</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --btn: #2b6cb0;
        --btnHover: #2c5282;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7fafc;
          --panel: #ffffff;
          --text: #1a202c;
          --muted: #4a5568;
          --btn: #2b6cb0;
          --btnHover: #2c5282;
        }
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(520px, calc(100vw - 2rem));
        background: var(--panel);
        border-radius: 14px;
        padding: 1.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.4;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        background: var(--btn);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      a.button:hover {
        background: var(--btnHover);
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      <p>Microsoft-only sign-in for Phase 1.</p>
      <a class="button" href="/auth/login">Sign in with Microsoft</a>
      <div class="hint">
        Backend must be running. Visit <code>/hello.html</code> after successful sign-in.
      </div>
    </main>
  </body>
</html>
