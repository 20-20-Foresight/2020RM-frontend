<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2020RM — Hello</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --border: rgba(255, 255, 255, 0.16);
        --btn: #2d3748;
        --btnHover: #1a202c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7fafc;
          --panel: #ffffff;
          --text: #1a202c;
          --muted: #4a5568;
          --border: #e2e8f0;
          --btn: #edf2f7;
          --btnHover: #e2e8f0;
        }
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(720px, calc(100vw - 2rem));
        background: var(--panel);
        border-radius: 14px;
        padding: 1.5rem;
        border: 1px solid var(--border);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      pre {
        margin: 1rem 0 0;
        padding: 0.75rem;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        overflow: auto;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 0.85rem;
        border-radius: 10px;
        background: var(--btn);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        border: 1px solid var(--border);
      }
      a.button:hover {
        background: var(--btnHover);
      }
      .muted {
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="row">
        <div>
          <h1>Hello</h1>
          <div class="muted">Data loaded from <code>GET /api/meta</code>.</div>
        </div>
        <a class="button" href="/auth/logout">Logout</a>
      </div>
      <pre id="output">Loading…</pre>
    </main>

    <script>
      async function load() {
        const output = document.getElementById("output");
        try {
          const res = await fetch("/api/meta", { headers: { Accept: "application/json" } });
          if (res.status === 401) {
            window.location.href = "/signin.html";
            return;
          }
          const json = await res.json();
          output.textContent = JSON.stringify(json, null, 2);
        } catch (err) {
          output.textContent = String(err && err.message ? err.message : err);
        }
      }

      load();
    </script>
  </body>
</html>
